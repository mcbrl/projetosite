# Reproduz o comportamento atual do WordPress (as-is) para as URLs que o Astro não gera.

map $arg_p $wp_short_link {
  default "";
  include /etc/nginx/wp-ids.map;
}

map $arg_page_id $wp_page_link {
  default "";
  include /etc/nginx/wp-ids.map;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;
  error_page 404 /404.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # /?p=ID e /?page_id=ID -> 301 para a URL do conteúdo, como o WP faz
  location = / {
    if ($wp_short_link) { return 301 $wp_short_link; }
    if ($wp_page_link)  { return 301 $wp_page_link; }
    try_files /index.html =404;
  }

  location ~ ^/(.+/)?feed/?$ { return 301 /; }
  location ^~ /author/        { return 301 /; }
  location ^~ /wp-admin       { return 302 /404/; }
  location = /wp-login.php    { return 403; }

  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }
}
